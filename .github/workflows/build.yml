name: Build Android TWA
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    name: Build and release Android AAB/APK
    runs-on: ubuntu-latest
    env:
      APP_ID: com.xxb.xj
      APP_NAME: Stl
      START_URL: https://stl1224.netlify.app/
      ICON_URL: https://imgchr.com/i/pmvP4jf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@latest

      - name: Setup Android SDK (API 33)
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          build-tools: '33.0.2'
          java-version: 17

      - name: Download launcher icon
        run: |
          wget -O launcher-icon.png "${{ env.ICON_URL }}" || true

      - name: Create keystore file from secret
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks

      - name: Initialize TWA project with Bubblewrap
        shell: bash
        env:
          APP_ID: ${{ env.APP_ID }}
          APP_NAME: ${{ env.APP_NAME }}
          START_URL: ${{ env.START_URL }}
        run: |
          set -e
          # Try to init using site's manifest if present; fall back to init with explicit options
          if curl --fail --silent --head $START_URL/manifest.json >/dev/null 2>&1; then
            echo "Using remote manifest"
            bubblewrap init --manifest $START_URL/manifest.json --applicationId $APP_ID --applicationName "$APP_NAME" || true
          else
            echo "No manifest found, initializing with explicit parameters"
            bubblewrap init --manifest $START_URL/manifest.json --applicationId $APP_ID --applicationName "$APP_NAME" --startUrl $START_URL --launcherName "$APP_NAME" --display standalone || true
          fi

      - name: Build Android (bubblewrap)
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          # If bubblewrap created an android project, build it; otherwise attempt to create a project folder then build
          if [ -d ./twa-manifest ]; then
            echo "Found bubblewrap project directory (twa-manifest). Running bubblewrap build"
            bubblewrap build --keystorePath=keystore.jks --keystoreAlias=$KEY_ALIAS --keystorePassword=$KEYSTORE_PASSWORD --keyPassword=$KEY_PASSWORD || true
          elif [ -d ./android ]; then
            echo "Found android/directory. Attempt bubblewrap build"
            bubblewrap build --keystorePath=keystore.jks --keystoreAlias=$KEY_ALIAS --keystorePassword=$KEYSTORE_PASSWORD --keyPassword=$KEY_PASSWORD || true
          else
            echo "No generated project found for bubblewrap to build. Attempting bubblewrap build anyway (it may create the project)."
            bubblewrap build --keystorePath=keystore.jks --keystoreAlias=$KEY_ALIAS --keystorePassword=$KEYSTORE_PASSWORD --keyPassword=$KEY_PASSWORD || true
          fi

      - name: Find output artifacts
        shell: bash
        run: |
          set -e
          echo "Listing possible build outputs"
          find . -type f -name "*-release.aab" -o -name "*-release.apk" -o -name "app-release.aab" -o -name "app-release.apk" -maxdepth 6 || true

      - name: Create GitHub release and upload artifacts
        id: release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_id }}
          name: "Stl Android build ${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: ./app/build/outputs/bundle/release/app-release.aab
          asset_name: Stl-release.aab
          asset_content_type: application/octet-stream

      - name: Upload APK (if exists)
        if: always()
        run: |
          if [ -f ./app/build/outputs/apk/release/app-release.apk ]; then
            echo "Uploading APK to release"
            gh release upload build-${{ github.run_id }} ./app/build/outputs/apk/release/app-release.apk --clobber || true
          else
            echo "APK not found; skipping APK upload"
          fi
