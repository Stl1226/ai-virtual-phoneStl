name: Android Release Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: Build, sign and release Android artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          ls -l release.keystore

      - name: Make gradlew executable if present
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Build release AAB and APK (use injected signing props)
        env:
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew bundleRelease assembleRelease -Pandroid.injected.signing.store.file=release.keystore -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          else
            echo "No gradlew found — aborting" && exit 1
          fi

      - name: Show produced outputs (for debugging)
        run: |
          echo "AAB outputs:"
          ls -l app/build/outputs/bundle/release || true
          echo "APK outputs:"
          ls -l app/build/outputs/apk/release || true

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ github.run_number }}
          name: release-${{ github.run_number }}
          body: Automated Android build from GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAB to Release
        if: success() && (files.exists('app/build/outputs/bundle/release/app-release.aab') || files.exists('app/build/outputs/bundle/release/*.aab'))
        uses: softprops/action-upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/bundle/release/app-release.aab
          asset_name: app-release.aab
          asset_content_type: application/octet-stream

      - name: Upload APK to Release
        if: success() && (files.exists('app/build/outputs/apk/release/app-release.apk') || files.exists('app/build/outputs/apk/release/*.apk'))
        uses: softprops/action-upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/release/app-release.apk
          asset_name: app-release.apk
          asset_content_type: application/vnd.android.package-archive
