name: Android Release Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: Build, sign and release Android artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          ls -l release.keystore

      - name: Make gradlew executable if present
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Build release AAB and APK (use injected signing props)
        env:
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew bundleRelease assembleRelease -Pandroid.injected.signing.store.file=release.keystore -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          else
            echo "No gradlew found — aborting" && exit 1
          fi

      - name: Show produced outputs (for debugging)
        run: |
          echo "AAB outputs:"
          ls -l app/build/outputs/bundle/release || true
          echo "APK outputs:"
          ls -l app/build/outputs/apk/release || true

      - name: Detect artifacts
        id: detect_artifacts
        run: |
          # Detect AAB
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          else
            if ls app/build/outputs/bundle/release/*.aab 1> /dev/null 2>&1; then
              AAB_PATH=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
            else
              AAB_PATH=""
            fi
          fi

          if [ -n "$AAB_PATH" ]; then
            AAB_NAME=$(basename "$AAB_PATH")
            echo "aab_exists=true" >> "$GITHUB_OUTPUT"
            echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
            echo "aab_name=$AAB_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "aab_exists=false" >> "$GITHUB_OUTPUT"
            echo "aab_path=" >> "$GITHUB_OUTPUT"
            echo "aab_name=" >> "$GITHUB_OUTPUT"
          fi

          # Detect APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
              APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
            else
              APK_PATH=""
            fi
          fi

          if [ -n "$APK_PATH" ]; then
            APK_NAME=$(basename "$APK_PATH")
            echo "apk_exists=true" >> "$GITHUB_OUTPUT"
            echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
            echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "apk_exists=false" >> "$GITHUB_OUTPUT"
            echo "apk_path=" >> "$GITHUB_OUTPUT"
            echo "apk_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ github.run_number }}
          name: release-${{ github.run_number }}
          body: Automated Android build from GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload found AAB to Release
        if: steps.detect_artifacts.outputs.aab_exists == 'true'
        uses: softprops/action-upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.detect_artifacts.outputs.aab_path }}
          asset_name: ${{ steps.detect_artifacts.outputs.aab_name }}
          asset_content_type: application/octet-stream

      - name: Upload found APK to Release
        if: steps.detect_artifacts.outputs.apk_exists == 'true'
        uses: softprops/action-upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.detect_artifacts.outputs.apk_path }}
          asset_name: ${{ steps.detect_artifacts.outputs.apk_name }}
          asset_content_type: application/vnd.android.package-archive
